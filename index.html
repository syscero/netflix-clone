<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/main.css">
    <!-- Responsividade-->
    <link rel="stylesheet" href="./style/responsive.css">
    <!-- Own css -->
    <link rel="stylesheet" href="./style/owl/owl.carousel.min.css">
    <link rel="stylesheet" href="./style/owl/owl.theme.default.min.css">

    <title>NETFLIX CLONE</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body class="is-loading" onload="init()">
    <header>
       <div class="container">
            <h2 class="logo">NETPHLIX</h2>
            <nav>
                <a href="#" class="is-disabled" aria-disabled="true" title="Login ilustrativo — sem autenticação">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg>
                    Login
                </a>
                <label class="perfil-label" for="perfil-select">Escolher perfil</label>
                <select id="perfil-select" onchange="mudarPerfil(this)">
                    <option value="0">Sou Normal</option>
                    <option value="1">Sou Terraplanista</option>
                    <option value="2">Prefiro Livros</option>
                </select>
            </nav>
       </div>
    </header>
    <main class="main" aria-busy="true">
        <div class="owl-carousel owl-theme">
            <div class="filme-principal item is-skeleton skeleton-pulse">
                <div class="container">
                    <h3 class="titulo">Carregando</h3>
                    <p class="descricao">Carregando catálogo</p>
                    <div class="botoes">
                        <button type="button" disabled aria-hidden="true">ASSISTIR AGORA</button>
                        <button type="button" disabled aria-hidden="true">MAIS INFORMAÇÕES</button>
                    </div>
                </div>
           </div>
       </div>
    </main>
    <section aria-busy="true">
        <div class="carrossel-filmes">
            <div class="categoria-filme is-skeleton skeleton-pulse">
                <h2>Carregando</h2>
                <div class="owl-carousel owl-theme">
                    <div class="item banner"></div>
                    <div class="item banner"></div>
                    <div class="item banner"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- TERCEIROS (vendored localmente — sem CDN) -->
   <script src="./js/owl/jquery.min.js"></script>
   <script src="./js/owl/owl.carousel.min.js"></script>
   <!-- -->
   <script src="./js/service.js"></script>
   <script src="./js/main.js"></script>
   <script src="./js/acoes.js"></script>
</body>
</html>
